[package]
name = "fen-events"
version.workspace = true
edition.workspace = true
description = "Event schemas and Kafka integration for distributed Fen"

[features]
default = []
# Enable Kafka integration
kafka = ["rdkafka"]

[dependencies]
fen-core = { path = "../fen-core" }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Protobuf
prost = "0.13"
prost-types = "0.13"

# Async
async-trait.workspace = true
tokio.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true

# UUID for event IDs
uuid.workspace = true

# Time
chrono.workspace = true

# Optional: Kafka client
rdkafka = { version = "0.37", features = ["cmake-build"], optional = true }

[build-dependencies]
prost-build = "0.13"

[lints]
workspace = true
