[package]
name = "fen-data"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Sharded data node binary for Fen distributed deployment"

[[bin]]
name = "fen-data"
path = "src/main.rs"

[dependencies]
fen-core = { path = "../fen-core", features = ["cluster"] }
fen-storage = { path = "../fen-storage" }
fen-cluster = { path = "../fen-cluster" }
fen-grpc = { path = "../fen-grpc" }
fen-events = { path = "../fen-events" }

# Async runtime
tokio.workspace = true
async-trait.workspace = true

# CLI
clap.workspace = true

# gRPC
tonic = "0.12"
prost-types = "0.13"

# HTTP client for coordinator
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Observability
tracing.workspace = true
tracing-subscriber.workspace = true

# Utilities
thiserror.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
dashmap.workspace = true

[dev-dependencies]
tokio-test.workspace = true
