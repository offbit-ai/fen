version: "3.9"

# Distributed Fen Infrastructure for Local Development
#
# This stack provides a complete distributed environment including:
# - Kafka (event streaming) with Zookeeper
# - PostgreSQL (user/tenant management)
# - TimescaleDB (observability/metrics)
# - Redpanda Console (Kafka UI)
# - Fen Coordinator (3 replicas for Raft consensus)
# - Fen Data Nodes (2 shards x 1 replica each for local dev)
# - Fen API Gateway
#
# Usage:
#   # Start infrastructure only (Kafka, DBs)
#   docker-compose -f deploy/docker/docker-compose.distributed.yml up -d kafka postgres timescaledb
#
#   # Start full stack
#   docker-compose -f deploy/docker/docker-compose.distributed.yml up -d
#
#   # View logs
#   docker-compose -f deploy/docker/docker-compose.distributed.yml logs -f
#
#   # Stop and clean up
#   docker-compose -f deploy/docker/docker-compose.distributed.yml down -v
#
# Access:
#   - Fen API: http://localhost:3000
#   - Kafka Console: http://localhost:8082
#   - PostgreSQL: localhost:5432 (fen/fen_dev_password)
#   - TimescaleDB: localhost:5433 (fen_metrics/fen_metrics_password)
#   - Coordinator API: http://localhost:9002

services:
  # ==========================================================================
  # Zookeeper - Kafka Coordination
  # ==========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: fen-zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat"
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fen-distributed

  # ==========================================================================
  # Kafka - Event Streaming
  # ==========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: fen-kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 8
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - fen-distributed

  # ==========================================================================
  # Kafka Topic Initialization
  # ==========================================================================
  kafka-init:
    image: confluentinc/cp-kafka:7.5.3
    container_name: fen-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'

      # Wait for Kafka to be ready
      kafka-topics --bootstrap-server kafka:29092 --list

      # Document ingestion topic (high throughput)
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic fen.document.ingestion \
        --partitions 16 --replication-factor 1 \
        --config retention.ms=604800000

      # Document processed topic
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic fen.document.processed \
        --partitions 16 --replication-factor 1 \
        --config retention.ms=604800000

      # Anomaly detected topic
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic fen.anomaly.detected \
        --partitions 8 --replication-factor 1 \
        --config retention.ms=2592000000

      # Baseline updates (compacted)
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic fen.baseline.updates \
        --partitions 4 --replication-factor 1 \
        --config cleanup.policy=compact

      # Metrics topic (short retention)
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic fen.metrics \
        --partitions 4 --replication-factor 1 \
        --config retention.ms=86400000

      # Alerts topic
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic fen.alerts \
        --partitions 4 --replication-factor 1 \
        --config retention.ms=2592000000

      # Validation results topic
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic fen.validation.results \
        --partitions 8 --replication-factor 1 \
        --config retention.ms=604800000

      echo 'Kafka topics created successfully!'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    networks:
      - fen-distributed

  # ==========================================================================
  # Redpanda Console - Kafka UI
  # ==========================================================================
  kafka-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.5
    container_name: fen-kafka-console
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
    ports:
      - "8082:8080"
    networks:
      - fen-distributed

  # ==========================================================================
  # PostgreSQL - User/Tenant Management
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: fen-postgres
    environment:
      POSTGRES_USER: fen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fen_dev_password}
      POSTGRES_DB: fen
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fen -d fen"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fen-distributed

  # ==========================================================================
  # TimescaleDB - Observability & Metrics
  # ==========================================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: fen-timescaledb
    environment:
      POSTGRES_USER: fen_metrics
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-fen_metrics_password}
      POSTGRES_DB: fen_metrics
    ports:
      - "5433:5432"
    volumes:
      - timescale-data:/home/postgres/pgdata/data
      - ./timescaledb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fen_metrics -d fen_metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fen-distributed

  # ==========================================================================
  # Keycloak - Authentication & SSO
  # ==========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: fen-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/fen-realm.json:/opt/keycloak/data/import/fen-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    command:
      - start-dev
      - --import-realm
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - fen-distributed

  # ==========================================================================
  # Fen Coordinator - Cluster Coordination (Raft consensus)
  # For local dev, we run a single coordinator. Production uses 3 replicas.
  # ==========================================================================
  coordinator:
    build:
      context: ../..
      dockerfile: Dockerfile.coordinator
    image: fen-coordinator:local
    container_name: fen-coordinator
    hostname: coordinator
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      NODE_ID: coordinator-0
      RAFT_ADDR: 0.0.0.0:9001
      API_ADDR: 0.0.0.0:9002
      PEER_ADDRS: ""
      NUM_SHARDS: 2
      REPLICATION_FACTOR: 1
      DATA_DIR: /data
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgres://fen:${POSTGRES_PASSWORD:-fen_dev_password}@postgres:5432/fen
      RUST_LOG: info,fen_coordinator=debug,fen_cluster=debug
    ports:
      - "9001:9001"
      - "9002:9002"
    volumes:
      - coordinator-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fen-distributed

  # ==========================================================================
  # Fen Data Node - Shard 0
  # ==========================================================================
  data-node-0:
    build:
      context: ../..
      dockerfile: Dockerfile.data
    image: fen-data:local
    container_name: fen-data-0
    hostname: data-node-0
    depends_on:
      coordinator:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      NODE_ID: data-node-0
      SHARD_IDS: "0"
      GRPC_ADDR: 0.0.0.0:9000
      COORDINATOR_ADDR: http://coordinator:9002
      DATA_DIR: /data
      HEARTBEAT_INTERVAL: 10
      ADVERTISED_ADDR: data-node-0:9000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RUST_LOG: info,fen_data=debug,fen_grpc=debug,fen_storage=debug
    ports:
      - "9100:9000"
    volumes:
      - data-node-0:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fen-distributed

  # ==========================================================================
  # Fen Data Node - Shard 1
  # ==========================================================================
  data-node-1:
    build:
      context: ../..
      dockerfile: Dockerfile.data
    image: fen-data:local
    container_name: fen-data-1
    hostname: data-node-1
    depends_on:
      coordinator:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      NODE_ID: data-node-1
      SHARD_IDS: "1"
      GRPC_ADDR: 0.0.0.0:9000
      COORDINATOR_ADDR: http://coordinator:9002
      DATA_DIR: /data
      HEARTBEAT_INTERVAL: 10
      ADVERTISED_ADDR: data-node-1:9000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RUST_LOG: info,fen_data=debug,fen_grpc=debug,fen_storage=debug
    ports:
      - "9101:9000"
    volumes:
      - data-node-1:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fen-distributed

  # ==========================================================================
  # Fen API Gateway - Distributed Mode
  # ==========================================================================
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: fen-api:local
    container_name: fen-api
    depends_on:
      coordinator:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BIND_ADDRESS: 0.0.0.0:3000
      CLUSTER_MODE: distributed
      COORDINATOR_ADDR: http://coordinator:9002
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NUM_SHARDS: 2
      DATABASE_URL: postgres://fen:${POSTGRES_PASSWORD:-fen_dev_password}@postgres:5432/fen
      TIMESCALE_URL: postgres://fen_metrics:${TIMESCALE_PASSWORD:-fen_metrics_password}@timescaledb:5432/fen_metrics
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me}
      REQUIRE_AUTH: "false"
      RULES_PATH: /app/rules
      MAX_UPLOAD_SIZE: 52428800
      RUST_LOG: info,fen_api=debug,fen_ingestion=debug,fen_rules=debug
    ports:
      - "3000:3000"
    volumes:
      - ../../rules:/app/rules:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fen-distributed

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  postgres-data:
  timescale-data:
  keycloak-data:
  coordinator-data:
  data-node-0:
  data-node-1:

networks:
  fen-distributed:
    driver: bridge
