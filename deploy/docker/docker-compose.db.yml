version: "3.9"

# Database infrastructure for Fen
#
# - PostgreSQL: User/tenant management, admin data
# - TimescaleDB: Time-series observability, metrics, events
#
# Usage:
#   docker-compose -f deploy/docker/docker-compose.db.yml up -d

services:
  # ==========================================================================
  # PostgreSQL - User/Tenant Management
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: fen-postgres
    environment:
      POSTGRES_USER: fen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fen_dev_password}
      POSTGRES_DB: fen
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fen -d fen"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fen-network

  # ==========================================================================
  # TimescaleDB - Observability & Metrics
  # ==========================================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: fen-timescaledb
    environment:
      POSTGRES_USER: fen_metrics
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-fen_metrics_password}
      POSTGRES_DB: fen_metrics
    ports:
      - "5433:5432"
    volumes:
      - timescale-data:/home/postgres/pgdata/data
      - ./timescaledb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fen_metrics -d fen_metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fen-network

  # ==========================================================================
  # Adminer - Database Admin UI (dev only)
  # ==========================================================================
  adminer:
    image: adminer:latest
    container_name: fen-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
      - timescaledb
    networks:
      - fen-network
    profiles:
      - dev

volumes:
  postgres-data:
  timescale-data:

networks:
  fen-network:
    driver: bridge
