version: "3.9"

# Complete Fen infrastructure stack
#
# Includes:
# - Keycloak (Authentication/SSO)
# - PostgreSQL (User/Tenant management)
# - TimescaleDB (Observability/Metrics)
# - Adminer (Database admin UI)
#
# Usage:
#   docker-compose -f deploy/docker/docker-compose.full.yml up -d
#
# Access:
#   - Keycloak Admin: http://localhost:8080/admin (admin/admin)
#   - Adminer: http://localhost:8081
#   - PostgreSQL: localhost:5432 (fen/fen_dev_password)
#   - TimescaleDB: localhost:5433 (fen_metrics/fen_metrics_password)

services:
  # ==========================================================================
  # Keycloak - Authentication & SSO
  # ==========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: fen-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/fen-realm.json:/opt/keycloak/data/import/fen-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    command:
      - start-dev
      - --import-realm
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fen-network

  # ==========================================================================
  # PostgreSQL - User/Tenant Management
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: fen-postgres
    environment:
      POSTGRES_USER: fen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fen_dev_password}
      POSTGRES_DB: fen
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fen -d fen"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fen-network

  # ==========================================================================
  # TimescaleDB - Observability & Metrics
  # ==========================================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: fen-timescaledb
    environment:
      POSTGRES_USER: fen_metrics
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-fen_metrics_password}
      POSTGRES_DB: fen_metrics
    ports:
      - "5433:5432"
    volumes:
      - timescale-data:/home/postgres/pgdata/data
      - ./timescaledb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fen_metrics -d fen_metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fen-network

  # ==========================================================================
  # Adminer - Database Admin UI (dev only)
  # ==========================================================================
  adminer:
    image: adminer:latest
    container_name: fen-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
      - timescaledb
    networks:
      - fen-network

volumes:
  keycloak-data:
  postgres-data:
  timescale-data:

networks:
  fen-network:
    driver: bridge
