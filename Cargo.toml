[workspace]
resolver = "2"
members = [
    "crates/fen-core",
    "crates/fen-storage",
    "crates/fen-ingestion",
    "crates/fen-rules",
    "crates/fen-ml",
    "crates/fen-api",
    "crates/fen-tests",
    # Distributed architecture crates
    "crates/fen-events",
    "crates/fen-notify",
    "crates/fen-cluster",
    "crates/fen-grpc",
    # Knowledge graph
    "crates/fen-graph",
    # Deployment binaries
    "crates/fen-coordinator",
    "crates/fen-data",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Fen Team"]
license = "MIT"

[workspace.dependencies]
# Async Runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Web Framework
axum = { version = "0.7", features = ["multipart", "macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }

# Storage
redb = "2.1"
lancedb = "0.17"
arrow = { version = "53", default-features = false }
arrow-array = "53"
arrow-schema = "53"

# Full-text Search & Query Language
tantivy = "0.22"
nom = "7.1"
nom_locate = "4.2"
miette = { version = "7.2", features = ["fancy"] }
ariadne = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# Performance
bumpalo = "3.16"
dashmap = "6.0"
once_cell = "1.20"
lru = "0.12"
governor = "0.8"
rstar = "0.12"
rayon = "1.10"

# Document Processing
pdfium-render = "0.8"
regex = "1.10"
image = "0.25"
imageproc = "0.25"

# ML & ONNX
ort = { version = "2.0.0-rc.11", default-features = false, features = ["ndarray", "std", "download-binaries", "tls-native"] }
ndarray = "0.17"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

# Rule Engine
zen-engine = "0.21"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Utilities
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde"] }
rust_decimal_macros = "1.36"
bytes = "1.0"
mime = "0.3"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# Authentication
jsonwebtoken = "9.3"
base64 = "0.22"

# HTTP Client
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2.1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono", "json"] }

# Testing
tokio-test = "0.4"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
