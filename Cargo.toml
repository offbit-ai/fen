[workspace]
resolver = "2"
members = [
    "crates/fen-core",
    "crates/fen-storage",
    "crates/fen-ingestion",
    "crates/fen-rules",
    "crates/fen-ml",
    "crates/fen-api",
    "crates/fen-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Fen Team"]
license = "MIT"

[workspace.dependencies]
# Async Runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Web Framework
axum = { version = "0.7", features = ["multipart", "macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }

# Storage
redb = "2.1"
lancedb = "0.17"
arrow = { version = "53", default-features = false }
arrow-array = "53"
arrow-schema = "53"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# Performance
bumpalo = "3.16"
dashmap = "6.0"
once_cell = "1.20"
lru = "0.12"
governor = "0.8"
rstar = "0.12"

# Document Processing
pdfium-render = "0.8"
regex = "1.10"
image = "0.25"

# ML & ONNX
ort = { version = "2.0.0-rc.11", default-features = false, features = ["ndarray", "std", "download-binaries", "tls-native"] }
ndarray = "0.17"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

# Rule Engine
zen-engine = "0.21"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde"] }
rust_decimal_macros = "1.36"
bytes = "1.0"
mime = "0.3"
futures = "0.3"

# Testing
tokio-test = "0.4"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
